SCATTER:
  Chain1D:
    enabled: false
    N: 2
    k_c_x: 180
    lattice_constant: 3.0
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
  FiniteLattice2D:
    enabled: true
    N_y: 1
    N_x: 2
    k_c_x: 900
    k_c_y: 900
    k_c_xy: 90
    lattice_constant: 3.0
    interaction_range: 1
