    k_el_x: 14400
    k_coupl_x: 14400
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0
  Ribbon2D:
    enabled: false
    N_y: 3
    k_el_x: 900
    k_el_y: 900
    k_el_xy: 90
    k_coupl_x: 900
    k_coupl_xy: 90
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0
  AnalyticalFourier:
    enabled: false
    N_q: 50
    k_el_x: 900
    k_el_y: 18
    k_el_xy: 0
    k_coupl_x: 180
    k_coupl_xy: 0
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
