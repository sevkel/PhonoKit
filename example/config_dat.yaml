CALCULATION:
  
  sys_descr: &descr "SystemDescription"
  data_path: &path "DataPathToSave"

  full_output_path: !join [*path, *descr]

  M_E: "Au"
  M_C: "Au"
  E:
    - 0
    - 25
  N: 500
  T_min: 0.001
  T_max: 300
  kappa_grid_points: 1000
  T_kappa_c: 77

ELECTRODE_L:
  DebyeModel:
    enabled: false
    E_D: 80
    k_coupl_x: 900
    k_coupl_xy: 0
  Chain1D:
    enabled: false
    k_el_x: 14400
    k_coupl_x: 14400
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0
  Ribbon2D:
    enabled: false
    N_y: 3
    k_el_x: 900
    k_el_y: 900
    k_el_xy: 90
    k_coupl_x: 900
    k_coupl_xy: 90
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0
  AnalyticalFourier:
    enabled: false
    N_q: 50
    k_el_x: 900
    k_el_y: 18
    k_el_xy: 0
    k_coupl_x: 180
    k_coupl_xy: 0
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0
  DecimationFourier:
    enabled: true
    N_y: 101
    N_q: 50
    k_el_x: 900
    k_el_y: 900
    k_el_xy: 90
    k_coupl_x: 900
    k_coupl_xy: 90
    interaction_range: 1
    interact_potential: reciproke_squared
    atom_type: Au
    lattice_constant: 3.0

ELECTRODE_R:
  DebyeModel:
    enabled: false
    E_D: 80
    k_coupl_x: 900
    k_coupl_xy: 0
  Chain1D:
